<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แกลเลอรีรูปภาพกิจกรรม</title>
  <!-- โหลด Tailwind CSS เพื่อความสวยงามและ responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-10 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🖼️</span>
      <div>
        <h1 class="text-lg font-bold text-gray-800">แกลเลอรีรูปภาพกิจกรรม</h1>
        <p class="text-xs text-gray-500">เรียกดูและดาวน์โหลดรูปภาพความละเอียดสูง</p>
      </div>
    </div>
    <button onclick="loadGallery()" class="text-sm px-3 py-1.5 border rounded-lg hover:bg-gray-100 flex items-center gap-1 transition">
      🔄 รีเฟรช
    </button>
  </header>

  <main class="max-w-7xl mx-auto p-6">
    <!-- กล่องแสดงสถานะกำลังโหลด (Spinner) -->
    <div id="loading" class="flex flex-col items-center justify-center py-24">
      <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-500 text-sm">กำลังโหลดรูปภาพจากระบบ...</p>
    </div>

    <!-- กล่องแสดงข้อผิดพลาด (ถ้ามี) -->
    <div id="error-box" class="hidden text-center py-16 text-red-500">
      <p id="error-msg">เกิดข้อผิดพลาดในการโหลดรูปภาพ</p>
      <button onclick="loadGallery()" class="mt-3 px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm">ลองใหม่อีกครั้ง</button>
    </div>

    <!-- กล่องแสดงรูปภาพ Grid -->
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
      <!-- รูปภาพจะถูกสร้างใส่ตรงนี้ผ่าน JS -->
    </div>
  </main>

  <script>
    // ⚠️ ใส่ Web App URL ของคุณที่ลงท้ายด้วย /exec (ห้ามใช้ script.googleusercontent.com หรือ /dev)
    const API_URL = "https://script.google.com/macros/s/AKfycbxfOAEoSE-iI1t5v_k7wvE50VI7mSTGFVYKbFp2Y6rTqZxF9DrnGu4O7hufjZ1J_WZs/exec";

    async function loadGallery() {
      const loadingEl = document.getElementById("loading");
      const galleryGrid = document.getElementById("gallery-grid");
      const errorBox = document.getElementById("error-box");

      // แสดง Loading ซ่อน Grid เดิม
      loadingEl.classList.remove("hidden");
      galleryGrid.classList.add("hidden");
      errorBox.classList.add("hidden");

      try {
        // ใช้ redirect: "follow" เพื่อป้องกันการติดค้างตอน Google Apps Script redirect
        const response = await fetch(API_URL, {
          method: "GET",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error("HTTP Status: " + response.status);
        }

        const resData = await response.json();

        // ตรวจสอบสถานะและข้อมูล Array ใน data
        if (resData.status === "success" && Array.isArray(resData.data)) {
          renderGallery(resData.data);
        } else {
          throw new Error(resData.message || "รูปแบบข้อมูลไม่ถูกต้อง");
        }
      } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById("error-msg").innerText = "ไม่สามารถโหลดรูปภาพได้: " + err.message;
        errorBox.classList.remove("hidden");
      } finally {
        // ซ่อน Loading ทุกกรณี
        loadingEl.classList.add("hidden");
      }
    }

    function renderGallery(items) {
      const galleryGrid = document.getElementById("gallery-grid");
      galleryGrid.innerHTML = "";

      if (items.length === 0) {
        galleryGrid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">ยังไม่มีรูปภาพในโฟลเดอร์</p>`;
        galleryGrid.classList.remove("hidden");
        return;
      }

      items.forEach(photo => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col";

        card.innerHTML = `
          <div class="relative bg-gray-100 aspect-video overflow-hidden">
            <img 
              src="${photo.thumbUrl}" 
              alt="${photo.title}" 
              loading="lazy"
              class="w-full h-full object-cover hover:scale-105 transition duration-300"
              onerror="this.src='https://placehold.co/600x400?text=Image+Not+Found'"
            />
          </div>
          <div class="p-4 flex flex-col justify-between flex-1">
            <div>
              <h2 class="font-medium text-gray-800 text-sm truncate" title="${photo.title}">
                ${photo.title}
              </h2>
              <p class="text-xs text-gray-400 mt-1">${photo.date || ''}</p>
            </div>
            <div class="mt-4 flex gap-2">
              <a 
                href="${photo.fullUrl}" 
                target="_blank" 
                class="flex-1 text-center py-1.5 px-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs rounded-lg transition"
              >
                ดูภาพเต็ม
              </a>
              <a 
                href="${photo.downloadUrl}" 
                target="_blank" 
                class="flex-1 text-center py-1.5 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs rounded-lg transition"
              >
                ดาวน์โหลด
              </a>
            </div>
          </div>
        `;
        galleryGrid.appendChild(card);
      });

      // แสดงกริดรูปภาพ
      galleryGrid.classList.remove("hidden");
    }

    // เรียกโหลดทันทีเมื่อเปิดหน้าเว็บ
    window.addEventListener("DOMContentLoaded", loadGallery);
  </script>
</body>
</html>
