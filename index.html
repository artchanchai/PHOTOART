<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แกลเลอรีรูปภาพกิจกรรม - LongLen Photography</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur sticky top-0 z-20 px-4 md:px-8 py-3 shadow-sm border-b border-gray-100 flex flex-wrap justify-between items-center gap-3">
    
    <!-- ฝั่งซ้าย: โลโก้ JPEG และเครดิตเพจ -->
    <div class="flex items-center gap-3">
      <!-- 
        👉 โลโก้ JPEG: 
        เปลี่ยน src="logo.jpg" เป็นที่อยู่ไฟล์ภาพของคุณ เช่น "images/logo.jpg" หรือ URL รูปภาพ
      -->
      <div class="w-11 h-11 md:w-12 md:h-12 rounded-full border border-gray-200 bg-white overflow-hidden shadow-sm flex-shrink-0 flex items-center justify-center">
        <img 
          src="Logo.jpg" 
          alt="LongLen Photography Logo" 
          class="w-full h-full object-cover"
          onerror="this.onerror=null; this.src='https://placehold.co/100x100/ffffff/333333?text=LongLen';"
        />
      </div>

      <!-- ข้อความชื่อและเครดิต -->
      <div>
        <h1 class="text-sm md:text-base font-semibold text-gray-900 leading-tight">แกลเลอรีรูปภาพกิจกรรม รัตนปูชนีนศรีปัญญา กษิณานุสรณ์</h1>
        <p class="text-xs text-gray-500 flex items-center gap-1.5 flex-wrap">
          <span>ระบบโดย</span>
          <span class="font-medium text-gray-700">LongLen Photography ลองเลนส์ โฟโต้กราฟฟี่ ช่างภาพ</span>
          <span class="inline-flex items-center gap-1 text-[11px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-full font-normal">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            รีเฟรชทุก 1 นาที
          </span>
        </p>
      </div>
    </div>
    
    <!-- ฝั่งขวา: ปุ่มติดตาม Facebook + ปุ่มดาวน์โหลดทั้งหมด -->
    <div class="flex items-center gap-2">
      <!-- ปุ่มติดตามเพจ Facebook -->
      <a 
        href="https://www.facebook.com/100092829680227" 
        target="_blank" 
        class="bg-[#1877F2] hover:bg-[#0c63d4] text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium shadow-sm flex items-center gap-1.5 transition active:scale-95"
      >
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span>ติดตามเพจ</span>
      </a>

      <!-- ปุ่มรีเฟรช -->
      <button onclick="loadGallery(false)" title="รีเฟรชรูปภาพ" class="p-2 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 rounded-lg transition active:rotate-180">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <!-- ปุ่มดาวน์โหลดทั้งหมด -->
      <button id="btn-download-all" onclick="downloadAllImages()" class="bg-gray-900 hover:bg-black text-white px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium shadow-sm flex items-center gap-1.5 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span id="txt-download-all">โหลดทั้งหมด</span>
      </button>
    </div>
  </header>

  <!-- Gallery Content -->
  <main class="max-w-7xl mx-auto p-4 md:p-6">
    <!-- โหลดครั้งแรก -->
    <div id="initial-loading" class="flex flex-col items-center justify-center py-28">
      <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-xs md:text-sm text-gray-500 font-medium">กำลังโหลดรูปภาพจากระบบ...</p>
    </div>

    <!-- กรณีไม่มีรูปภาพ -->
    <div id="empty-state" class="hidden text-center py-24 text-gray-400">
      <p class="text-sm">ยังไม่มีรูปภาพในโฟลเดอร์</p>
    </div>

    <!-- Masonry Layout รักษาสัดส่วนรูปภาพแท้จริง -->
    <div id="gallery-container" class="columns-2 sm:columns-3 md:columns-4 lg:columns-5 gap-3 md:gap-4 space-y-3 md:space-y-4 hidden">
      <!-- การ์ดภาพจะถูกเรนเดอร์ที่นี่ -->
    </div>
  </main>

  <!-- Modal ขยายรูปขนาดใหญ่ -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex flex-col justify-between items-center p-4 md:p-6 opacity-0 transition-opacity duration-300">
    <!-- แถบด้านบนของ Modal -->
    <div class="w-full flex justify-between items-center text-white px-2">
      <span id="modal-title" class="text-xs md:text-sm font-light text-gray-300 truncate max-w-[70%]"></span>
      <button onclick="closeModal()" class="p-2 hover:bg-white/10 rounded-full transition text-gray-300 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- รูปภาพที่คลิกดู -->
    <div class="relative flex items-center justify-center flex-1 w-full max-h-[78vh] my-2">
      <img id="modal-img" src="" alt="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl transition duration-200">
    </div>

    <!-- ปุ่มดาวน์โหลดภาพเดี่ยวลงเครื่องโดยตรง -->
    <div class="w-full flex justify-center pb-2">
      <button id="modal-download-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-full text-sm font-medium shadow-lg flex items-center gap-2 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span id="modal-download-text">ดาวน์โหลดรูปนี้ลงเครื่อง</span>
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxfOAEoSE-iI1t5v_k7wvE50VI7mSTGFVYKbFp2Y6rTqZxF9DrnGu4O7hufjZ1J_WZs/exec";
    let cachedImages = [];
    let currentActivePhoto = null;

    // โหลดข้อมูลรูปภาพ
    async function loadGallery(isBackground = false) {
      const initialLoading = document.getElementById("initial-loading");
      const emptyState = document.getElementById("empty-state");
      const galleryContainer = document.getElementById("gallery-container");

      if (!isBackground && cachedImages.length === 0) {
        initialLoading.classList.remove("hidden");
        galleryContainer.classList.add("hidden");
      }

      try {
        const response = await fetch(API_URL, {
          method: "GET",
          redirect: "follow"
        });

        const result = await response.json();

        if (result.status === "success" && Array.isArray(result.data)) {
          if (JSON.stringify(result.data) !== JSON.stringify(cachedImages)) {
            cachedImages = result.data;
            renderGallery(cachedImages);
          }
        }
      } catch (err) {
        console.error("Auto-fetch error:", err);
      } finally {
        initialLoading.classList.add("hidden");
      }
    }

    // แสดงรูปภาพตามสัดส่วนภาพจริง
    function renderGallery(photos) {
      const container = document.getElementById("gallery-container");
      const emptyState = document.getElementById("empty-state");
      container.innerHTML = "";

      if (photos.length === 0) {
        emptyState.classList.remove("hidden");
        container.classList.add("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      container.classList.remove("hidden");

      photos.forEach((photo) => {
        const item = document.createElement("div");
        item.className = "break-inside-avoid overflow-hidden rounded-xl bg-gray-200 shadow-sm hover:shadow-md transition group cursor-pointer relative";
        
        item.innerHTML = `
          <img 
            src="${photo.thumbUrl}" 
            alt="${photo.title || 'รูปภาพกิจกรรม'}" 
            loading="lazy" 
            class="w-full h-auto block rounded-xl group-hover:scale-[1.02] transition duration-300 ease-out"
          />
          <div class="absolute inset-0 bg-black/25 opacity-0 group-hover:opacity-100 transition duration-200 flex items-center justify-center rounded-xl">
            <span class="bg-black/60 text-white rounded-full p-2.5 backdrop-blur-sm shadow">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
              </svg>
            </span>
          </div>
        `;

        item.addEventListener("click", () => openModal(photo));
        container.appendChild(item);
      });
    }

    // ฟังก์ชันดาวน์โหลดไฟล์ภาพลงเครื่องโดยตรง (Direct Download ผ่าน Blob)
    async function triggerDirectDownload(photoUrl, filename) {
      try {
        const res = await fetch(photoUrl);
        const blob = await res.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = blobUrl;
        a.download = filename || "photo.jpg";
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (e) {
        // แผนสำรองกรณี fetch ติด CORS: สั่ง trigger ดาวน์โหลดด้วย download attribute
        const a = document.createElement("a");
        a.href = photoUrl;
        a.download = filename || "photo.jpg";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    // Modal ขยายรูป
    function openModal(photo) {
      currentActivePhoto = photo;
      const modal = document.getElementById("image-modal");
      const modalImg = document.getElementById("modal-img");
      const modalTitle = document.getElementById("modal-title");
      const downloadBtnText = document.getElementById("modal-download-text");

      modalImg.src = photo.fullUrl || photo.thumbUrl;
      modalTitle.textContent = photo.title || "";
      downloadBtnText.textContent = "ดาวน์โหลดรูปนี้ลงเครื่อง";

      modal.classList.remove("hidden");
      setTimeout(() => {
        modal.classList.remove("opacity-0");
      }, 10);
      document.body.style.overflow = "hidden";
    }

    // ปิด Modal
    function closeModal() {
      const modal = document.getElementById("image-modal");
      modal.classList.add("opacity-0");
      setTimeout(() => {
        modal.classList.add("hidden");
        document.getElementById("modal-img").src = "";
        document.body.style.overflow = "auto";
        currentActivePhoto = null;
      }, 300);
    }

    // ผูก Event ให้ปุ่มดาวน์โหลดเดี่ยวใน Modal
    document.getElementById("modal-download-btn").addEventListener("click", async () => {
      if (!currentActivePhoto) return;
      const btnText = document.getElementById("modal-download-text");
      btnText.textContent = "กำลังดาวน์โหลด...";
      
      const targetUrl = currentActivePhoto.fullUrl || currentActivePhoto.thumbUrl;
      const targetName = currentActivePhoto.title || "photo.jpg";
      
      await triggerDirectDownload(targetUrl, targetName);
      btnText.textContent = "ดาวน์โหลดเรียบร้อย!";
      setTimeout(() => {
        btnText.textContent = "ดาวน์โหลดรูปนี้ลงเครื่อง";
      }, 2000);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
    document.getElementById("image-modal").addEventListener("click", (e) => {
      if (e.target.id === "image-modal") closeModal();
    });

    // ปุ่มดาวน์โหลดรูปภาพทั้งหมด
    async function downloadAllImages() {
      if (cachedImages.length === 0) {
        alert("ยังไม่มีรูปภาพให้ดาวน์โหลด");
        return;
      }

      const confirmDownload = confirm(`ต้องการดาวน์โหลดรูปภาพทั้งหมด ${cachedImages.length} รูปลงเครื่องใช่หรือไม่?`);
      if (!confirmDownload) return;

      const btnAll = document.getElementById("btn-download-all");
      const txtAll = document.getElementById("txt-download-all");
      btnAll.disabled = true;

      for (let i = 0; i < cachedImages.length; i++) {
        const photo = cachedImages[i];
        txtAll.textContent = `โหลด (${i + 1}/${cachedImages.length})`;
        const targetUrl = photo.fullUrl || photo.thumbUrl;
        const targetName = photo.title || `photo_${i + 1}.jpg`;
        await triggerDirectDownload(targetUrl, targetName);
        // เว้นช่วง 400ms เพื่อไม่ให้เบราว์เซอร์ตัดการดาวน์โหลด
        await new Promise((r) => setTimeout(r, 400));
      }

      txtAll.textContent = "เสร็จสิ้น!";
      setTimeout(() => {
        txtAll.textContent = "โหลดทั้งหมด";
        btnAll.disabled = false;
      }, 2500);
    }

    // เริ่มต้นทำงานและตั้งเวลารีเฟรชทุก 1 นาที
    window.addEventListener("DOMContentLoaded", () => {
      loadGallery(false);
      setInterval(() => {
        loadGallery(true);
      }, 60000);
    });
  </script>
</body>
</html>
