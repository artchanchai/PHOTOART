<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แกลเลอรีรูปภาพกิจกรรม - LongLen Photography</title>
  
  <!-- ไอคอนเว็บไซต์ (Favicon JPG) -->
  <link rel="icon" type="image/jpeg" href="Logo.jpg">
  <link rel="apple-touch-icon" href="Logo.jpg">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header ด้านบน (ใช้ sticky top-0 หมดปัญหา Header ทับรูปบนมือถือแน่นอน 100%) -->
  <header class="bg-white/95 backdrop-blur sticky top-0 z-30 px-4 md:px-8 py-3 shadow-sm border-b border-gray-100 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 md:w-11 md:h-11 rounded-full border border-gray-200 bg-white overflow-hidden shadow-sm flex-shrink-0 flex items-center justify-center">
        <img 
          src="Logo.jpg" 
          alt="LongLen Photography" 
          class="w-full h-full object-cover"
          onerror="this.onerror=null; this.src='https://placehold.co/100x100/ffffff/333333?text=LongLen';"
        />
      </div>

      <div>
        <h1 class="text-sm md:text-base font-semibold text-gray-900 leading-tight">แกลเลอรีรูปภาพกิจกรรม รัตนปูชนียศรีปัญญา กษิณานุสรณ์</h1>
        <p class="text-[11px] md:text-xs text-gray-500 flex items-center gap-1.5 flex-wrap">
          <span>ระบบโดย</span>
          <span class="font-medium text-gray-700">LongLen Photography ลองเลนส์ โฟโต้กราฟฟี่</span>
          <span class="inline-flex items-center gap-1 text-[10px] md:text-[11px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-full font-normal">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            อัปเดตทุก 1 นาที
          </span>
        </p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <a 
        href="https://www.facebook.com/100092829680227" 
        target="_blank" 
        class="bg-[#1877F2] hover:bg-[#0c63d4] text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium shadow-sm flex items-center gap-1.5 transition active:scale-95"
      >
        <svg class="w-3.5 h-3.5 md:w-4 md:h-4 fill-current" viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span>ติดตามเพจ</span>
      </a>

      <button onclick="loadGallery(false)" title="รีเฟรชรูปภาพ" class="p-2 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 rounded-lg transition active:rotate-180">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 md:w-5 md:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <button id="btn-download-all" onclick="downloadAllImages()" class="bg-gray-900 hover:bg-black text-white px-3 md:px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium shadow-sm flex items-center gap-1.5 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 md:w-4 md:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span id="txt-download-all">โหลดทั้งหมด</span>
      </button>
    </div>
  </header>

  <!-- เนื้อหา Gallery (ใส่ pb-28 ป้องกันแถบล่างบังรูปแถวสุดท้าย) -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 pb-28">
    <div id="initial-loading" class="flex flex-col items-center justify-center py-28">
      <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-xs md:text-sm text-gray-500 font-medium">กำลังโหลดรูปภาพจากระบบ...</p>
    </div>

    <div id="empty-state" class="hidden text-center py-24 text-gray-400">
      <p class="text-sm">ยังไม่มีรูปภาพในโฟลเดอร์</p>
    </div>

    <!-- Grid เรียงรูปภาพจากซ้ายไปขวาตามลำดับเวลา -->
    <div id="gallery-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 hidden"></div>
  </main>

  <!-- Footer ด้านล่าง (Fixed อยู่กับที่) -->
  <footer class="bg-white/95 backdrop-blur fixed bottom-0 left-0 right-0 z-30 border-t border-gray-200/80 px-4 py-2.5 shadow-md select-none">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-gray-600">
      
      <div class="flex items-center gap-3 md:gap-4">
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>ออนไลน์: <b id="online-count" class="text-emerald-600 font-semibold">1</b> คน</span>
        </div>
        <span class="text-gray-300">|</span>
        <div class="flex items-center gap-1.5">
          <span>เข้าชมทั้งหมด: <b id="visit-count" class="text-indigo-600 font-semibold">...</b> ครั้ง</span>
        </div>
      </div>

      <div class="text-[11px] text-gray-400">
        © 2026 LongLen Photography. All rights reserved.
      </div>

    </div>
  </footer>

  <!-- Modal ขยายรูป -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex flex-col justify-between items-center p-4 md:p-6 opacity-0 transition-opacity duration-300">
    <div class="w-full flex justify-between items-center text-white px-2">
      <span id="modal-title" class="text-xs md:text-sm font-light text-gray-300 truncate max-w-[70%]"></span>
      <button onclick="closeModal()" class="p-2 hover:bg-white/10 rounded-full transition text-gray-300 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="relative flex items-center justify-center flex-1 w-full max-h-[78vh] my-2">
      <img id="modal-img" src="" alt="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl transition duration-200">
    </div>

    <div class="w-full flex justify-center pb-2">
      <button id="modal-download-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-full text-sm font-medium shadow-lg flex items-center gap-2 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span id="modal-download-text">ดาวน์โหลดรูปนี้ลงเครื่อง</span>
      </button>
    </div>
  </div>

  <iframe id="download-frame" style="display:none;"></iframe>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxfOAEoSE-iI1t5v_k7wvE50VI7mSTGFVYKbFp2Y6rTqZxF9DrnGu4O7hufjZ1J_WZs/exec";
    let cachedImages = [];
    let currentActivePhoto = null;

    let myClientId = sessionStorage.getItem("longlen_session_client_id");
    if (!myClientId) {
      myClientId = "device_" + Math.random().toString(36).substr(2, 9) + "_" + Date.now();
      sessionStorage.setItem("longlen_session_client_id", myClientId);
    }

    function instantDownload(fileId) {
      const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
      const iframe = document.getElementById("download-frame");
      iframe.src = downloadUrl;
    }

    async function loadGallery(isBackground = false) {
      const initialLoading = document.getElementById("initial-loading");
      const emptyState = document.getElementById("empty-state");
      const galleryContainer = document.getElementById("gallery-container");

      if (!isBackground && cachedImages.length === 0) {
        initialLoading.classList.remove("hidden");
        galleryContainer.classList.add("hidden");
      }

      try {
        const response = await fetch(`${API_URL}?_t=${Date.now()}`, { method: "GET", redirect: "follow" });
        const result = await response.json();

        if (result.status === "success" && Array.isArray(result.data)) {
          if (JSON.stringify(result.data) !== JSON.stringify(cachedImages)) {
            cachedImages = result.data;
            renderGallery(cachedImages);
          }
        }
      } catch (err) {
        console.error("Auto-fetch error:", err);
      } finally {
        initialLoading.classList.add("hidden");
      }
    }

    function renderGallery(photos) {
      const container = document.getElementById("gallery-container");
      const emptyState = document.getElementById("empty-state");
      container.innerHTML = "";

      if (photos.length === 0) {
        emptyState.classList.remove("hidden");
        container.classList.add("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      container.classList.remove("hidden");

      photos.forEach((photo) => {
        const item = document.createElement("div");
        item.className = "group relative cursor-pointer overflow-hidden rounded-xl bg-gray-200/70 border border-gray-200 shadow-sm hover:shadow-md transition aspect-[4/3] flex items-center justify-center";
        
        item.innerHTML = `
          <img 
            src="${photo.thumbUrl}" 
            alt="${photo.title || 'รูปภาพกิจกรรม'}" 
            loading="lazy" 
            class="w-full h-full object-contain p-1 group-hover:scale-105 transition duration-300 ease-out"
          />
          <div class="absolute inset-0 bg-black/25 opacity-0 group-hover:opacity-100 transition duration-200 flex items-center justify-center rounded-xl pointer-events-none">
            <span class="bg-black/60 text-white rounded-full p-2.5 backdrop-blur-sm shadow">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
              </svg>
            </span>
          </div>
        `;

        item.addEventListener("click", () => openModal(photo));
        container.appendChild(item);
      });
    }

    function openModal(photo) {
      currentActivePhoto = photo;
      const modal = document.getElementById("image-modal");
      const modalImg = document.getElementById("modal-img");
      const modalTitle = document.getElementById("modal-title");
      const downloadBtnText = document.getElementById("modal-download-text");

      modalImg.src = photo.fullUrl || photo.thumbUrl;
      modalTitle.textContent = photo.title || "";
      downloadBtnText.textContent = "ดาวน์โหลดรูปนี้ลงเครื่อง";

      modal.classList.remove("hidden");
      setTimeout(() => modal.classList.remove("opacity-0"), 10);
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("image-modal");
      modal.classList.add("opacity-0");
      setTimeout(() => {
        modal.classList.add("hidden");
        document.getElementById("modal-img").src = "";
        document.body.style.overflow = "auto";
        currentActivePhoto = null;
      }, 300);
    }

    document.getElementById("modal-download-btn").addEventListener("click", () => {
      if (!currentActivePhoto) return;
      const btnText = document.getElementById("modal-download-text");
      btnText.textContent = "กำลังเริ่มดาวน์โหลด...";
      instantDownload(currentActivePhoto.id);
      setTimeout(() => btnText.textContent = "สั่งโหลดแล้ว!", 500);
      setTimeout(() => btnText.textContent = "ดาวน์โหลดรูปนี้ลงเครื่อง", 2000);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
    document.getElementById("image-modal").addEventListener("click", (e) => {
      if (e.target.id === "image-modal" || e.target.tagName === "IMG") {
        if (e.target.id === "image-modal") closeModal();
      }
    });

    function downloadAllImages() {
      if (cachedImages.length === 0) {
        alert("ยังไม่มีรูปภาพให้ดาวน์โหลด");
        return;
      }

      const confirmDownload = confirm(`ต้องการดาวน์โหลดรูปภาพทั้งหมด ${cachedImages.length} รูปลงเครื่องใช่หรือไม่?`);
      if (!confirmDownload) return;

      const txtAll = document.getElementById("txt-download-all");
      const btnAll = document.getElementById("btn-download-all");
      btnAll.disabled = true;

      cachedImages.forEach((photo, index) => {
        setTimeout(() => {
          txtAll.textContent = `โหลด (${index + 1}/${cachedImages.length})`;
          const a = document.createElement("a");
          a.href = `https://drive.google.com/uc?export=download&id=${photo.id}`;
          a.target = "_blank";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          if (index === cachedImages.length - 1) {
            setTimeout(() => {
              txtAll.textContent = "เสร็จสิ้น!";
              setTimeout(() => {
                txtAll.textContent = "โหลดทั้งหมด";
                btnAll.disabled = false;
              }, 2000);
            }, 1000);
          }
        }, index * 800);
      });
    }

    async function syncStats(isPageHit = false) {
      try {
        const url = `${API_URL}?action=stats&clientId=${encodeURIComponent(myClientId)}&isHit=${isPageHit}&_t=${Date.now()}`;
        const res = await fetch(url, { method: "GET", redirect: "follow", cache: "no-store" });
        const data = await res.json();

        if (data.status === "success") {
          document.getElementById("visit-count").textContent = Number(data.totalVisits).toLocaleString();
          document.getElementById("online-count").textContent = Number(data.onlineCount).toLocaleString();
        }
      } catch (err) {
        console.error("Stats sync error:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadGallery(false);
      syncStats(true);

      setInterval(() => {
        syncStats(false);
      }, 15000);

      setInterval(() => {
        loadGallery(true);
      }, 60000);
    });
  </script>
</body>
</html>
